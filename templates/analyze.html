{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TextUtils | Result</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f9;
    }

    .result-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    pre {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .badge-custom {
      background: #343a40;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand font-weight-bold" href="/">TextUtils</a>
  </div>
</nav>

<!-- Success Alert -->
<div class="container mt-4">
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Success!</strong> Your text has been analyzed successfully.
    <button type="button" class="close" data-dismiss="alert">
      <span>&times;</span>
    </button>
  </div>
</div>

<!-- Result Section -->
<div class="container my-4">
  <div class="result-card">

    <h3 class="font-weight-bold mb-3">
      Your Analyzed Text
      <span class="badge badge-custom ml-2">{{ purpose }}</span>
    </h3>

    <pre>{{ analyzed_text }}</pre>

    <!-- Action Buttons -->
    <div class="text-right mt-4">
      <a href="/" class="btn btn-outline-dark">
        Analyze Another Text
      </a>
    </div>

  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"></script>

</body>
</html>
