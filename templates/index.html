{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>TextUtils | Smart Text Analyzer</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f9;
    }
    .hero {
      background: linear-gradient(135deg, #212529, #343a40);
      color: white;
      padding: 40px 0;
      text-align: center;
    }
    .card {
      border-radius: 15px;
    }
    textarea {
      resize: none;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">TextUtils</a>
  </div>
</nav>

<!-- Hero Section -->
<div class="hero">
  <h1 class="fw-bold">Smart Text Analyzer</h1>
  <p class="mb-0">Clean, format, and analyze your text in seconds 🚀</p>
</div>

<!-- Main Container -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow p-4">
        <form action="/analyze/" method="post">
          {% csrf_token %}

          <!-- Text Area -->
          <div class="mb-4">
            <label class="form-label fw-semibold">
              Enter your text below
            </label>
            <textarea
              class="form-control"
              name="text"
              rows="7"
              placeholder="Type or paste your text here..."
            ></textarea>
          </div>

          <!-- Options -->
          <div class="row">
            <div class="col-md-6">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="removepunc">
                <label class="form-check-label">Remove Punctuation</label>
              </div>

              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="fullcaps">
                <label class="form-check-label">Convert to UPPERCASE</label>
              </div>

              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="newlineremover">
                <label class="form-check-label">Remove New Lines</label>
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="extraspaceremover">
                <label class="form-check-label">Remove Extra Spaces</label>
              </div>

              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="charcount">
                <label class="form-check-label">Character Count</label>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-dark px-5 py-2">
              Analyze Text
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center text-muted py-3">
  © 2025 TextUtils | Built with Django ❤️
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
